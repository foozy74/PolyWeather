<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PolyWeather Dashboard</title>
  </head>
  <body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased selection:bg-blue-500/30">
    <!-- Header -->
    <header class="sticky top-0 z-50 backdrop-blur-md bg-slate-900/80 border-b border-slate-800 shadow-lg">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="p-2 bg-blue-500/20 rounded-lg">
            <i data-lucide="cloud-lightning" class="w-6 h-6 text-blue-400"></i>
          </div>
          <div>
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400 tracking-tight">PolyWeather</h1>
            <p class="text-xs text-slate-400 font-medium tracking-wide uppercase">Live Dashboard</p>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <div id="loading" class="flex flex-col items-center justify-center py-20 animate-pulse">
        <div class="h-12 w-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-slate-400 font-medium">Lade Wetterdaten...</p>
      </div>
      
      <div id="error-message" class="hidden max-w-2xl mx-auto mb-8 bg-red-500/10 border border-red-500/20 rounded-xl p-4 flex items-start gap-3">
        <i data-lucide="shield-alert" class="w-5 h-5 text-red-400 mt-0.5 shrink-0"></i>
        <div>
          <h3 class="text-sm font-semibold text-red-400">Verbindungsfehler</h3>
          <p id="error-text" class="text-sm text-red-300 mt-1"></p>
        </div>
      </div>

      <div id="cities-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- City cards will be injected here by main.js -->
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
